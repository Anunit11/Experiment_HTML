<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - E-commerce Product Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1>ShopEasy</h1>
    </header>

    <main class="container">
        <div class="product-card">
            <div class="image-box">
                <img src="Virat_kohli.png" alt="Classic Cotton T-Shirt">
            </div>
            
            <h2 class="product-title">Classic Cotton T-Shirt</h2>
            <p class="product-desc">Soft, breathable cotton. Regular fit. Available in multiple colors.</p>
            
            <div class="price-box">
                <span class="current-price">₹799</span>
                <span class="old-price">₹1,199</span>
            </div>
            
            <button class="cart-btn">Add to Cart</button>
        </div>
    </main>

</body>
</html>
